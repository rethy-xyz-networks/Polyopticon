name: Release

# Publish a release on GitHub (Releases → Draft a new release, tag like v0.1.0-alpha.1) and this
# builds the portable .exe and attaches it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:unit

      # Use the tag as the app version, so the exe and the About version match the release
      - name: Set version from tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build portable exe
        run: npx electron-builder --win portable --publish never
        env:
          # No signing certificate yet; stop electron-builder from looking for one
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach exe to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.exe --clobber
